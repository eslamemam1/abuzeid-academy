@if (course(); as item) {
  <article class="course-card">
    <div class="course-cover" [class]="item.category">
      <span class="badge">{{ item.levelLabel }}</span>
      <span>{{ item.categoryLabel }}</span>
    </div>
    <div class="course-body">
      <h3>{{ item.title }}</h3>
      <p class="meta">{{ item.date }} • {{ item.price > 0 ? item.price + ' ج.م' : 'أونلاين' }}</p>
      <p class="meta course-blurb">{{ item.description }}</p>
      <div class="course-actions">
        <a class="btn btn-ghost" [routerLink]="['/courses', item.id]">ادخل الكورس</a>
        <a class="btn btn-primary" routerLink="/register">اشترك في الكورس</a>
      </div>
    </div>
  </article>
}
