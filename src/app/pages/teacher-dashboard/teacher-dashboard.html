<app-teacher-shell
  title="لوحة المهندس إسلام إمام"
  subtitle="تابع الطلاب، الامتحانات، والدرجات من مكان واحد."
  [message]="message()"
  [error]="error()"
>
  <div class="grid-4" style="margin-bottom: 28px;">
    <app-stat-card [value]="students().length" label="عدد الطلاب" />
    <app-stat-card [value]="courses().length" label="المواد" link="/teacher/courses" />
    <app-stat-card [value]="exams().length" label="الامتحانات" />
    <app-stat-card [value]="unreadCount()" label="رسائل جديدة" link="/teacher/messages" />
  </div>

  <div class="grid-2">
    <app-panel title="إنشاء امتحان">
      <form class="form" [formGroup]="examForm" (submit)="$event.preventDefault(); createExam()">
        <label>
          المادة
          <select formControlName="course_id">
            <option value="">اختر المادة</option>
            @for (course of courses(); track course.id) {
              <option [value]="course.id">{{ course.title }} — {{ yearLabel(course.year_level) }}</option>
            }
          </select>
        </label>
        <label>
          عنوان الامتحان
          <input type="text" formControlName="title" placeholder="امتحان نصف العام" />
        </label>
        <label>
          التاريخ
          <input type="date" formControlName="exam_date" />
        </label>
        <label>
          الدرجة النهائية
          <input type="number" formControlName="total_marks" />
        </label>
        <button class="btn btn-primary" type="submit">حفظ الامتحان</button>
      </form>
    </app-panel>

    <app-panel title="آخر الطلاب">
      @if (students().length === 0) {
        <p class="meta">لسه مفيش طلاب مسجّلين.</p>
      } @else {
        <ul class="outcomes">
          @for (student of students().slice(0, 6); track student.id) {
            <li>{{ student.full_name }} — {{ yearLabel(student.year_level) }}</li>
          }
        </ul>
        <a class="btn btn-outline" routerLink="/teacher/students">عرض كل الطلاب</a>
      }
    </app-panel>
  </div>
</app-teacher-shell>
