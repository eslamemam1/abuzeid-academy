<app-teacher-shell title="الطلاب" subtitle="كل الطلاب المسجّلين في أكاديمية أبو زيد.">
  <app-panel>
    <p class="meta">عدد الطلاب: {{ students().length }}</p>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>البريد</th>
            <th>الموبايل</th>
            <th>السنة</th>
          </tr>
        </thead>
        <tbody>
          @for (student of students(); track student.id) {
            <tr>
              <td>{{ student.full_name }}</td>
              <td>{{ student.email || '—' }}</td>
              <td>{{ student.phone || '—' }}</td>
              <td>{{ yearLabel(student.year_level) }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4">لا يوجد طلاب حتى الآن.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-panel>
</app-teacher-shell>
