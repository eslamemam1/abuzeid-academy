<section class="section basics-page">
  <div class="container">
    <div class="section-head">
      <h1>12 مفهوم هتحتاجهم من أول يوم</h1>
      <p>مصطلحات واضحة بالعربي والإنجليزي — من غير لف، ومن غير تعقيد.</p>
    </div>

    <div class="concept-grid">
      @for (item of concepts; track item.en; let i = $index) {
        <article class="concept-card">
          <div class="concept-top">
            <span class="concept-en">{{ item.en }}</span>
            <span class="concept-num">#{{ i + 1 }}</span>
          </div>
          <h3>{{ item.ar }}</h3>
          <p>{{ item.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
