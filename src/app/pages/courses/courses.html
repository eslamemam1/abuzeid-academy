<app-page-hero
  [eyebrow]="heroEyebrow()"
  title="دورات البرمجة والذكاء الاصطناعي"
  [subtitle]="heroSubtitle()"
/>

<section class="section">
  <div class="container">
    <form class="search-box" style="max-width: 100%;" (submit)="$event.preventDefault(); applySearch()">
      <input type="search" [formControl]="search" placeholder="ابحث باسم المادة: برمجة، OOP، تعلم آلة..." />
      <button type="submit">بحث</button>
    </form>

    <div class="filters">
      @for (category of categories(); track category.id) {
        <button
          type="button"
          class="chip"
          [class.active]="selectedCategory() === category.id"
          (click)="setCategory(category.id)"
        >
          {{ category.label }}
        </button>
      }
    </div>

    <p class="meta" style="margin-bottom: 18px;">عدد المواد: {{ results().length }}</p>

    <div class="grid-3">
      @for (course of results(); track course.id) {
        <app-course-card [course]="course" />
      } @empty {
        <p>لا توجد مواد مطابقة لبحثك حالياً.</p>
      }
    </div>
  </div>
</section>
