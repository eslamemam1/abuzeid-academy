<app-teacher-shell
  title="رصد الدرجات"
  subtitle="اختر امتحانًا ثم سجّل درجة كل طالب."
  [message]="message()"
  [error]="error()"
>
  <app-panel>
    <label class="form">
      الامتحان
      <select [ngModel]="selectedExamId()" (ngModelChange)="onExamChange($event)">
        <option value="">اختر امتحانًا</option>
          @for (exam of exams(); track exam.id) {
            <option [value]="exam.id">
              {{ exam.title }} — {{ exam.courses?.title }} — {{ yearLabel(exam.courses?.year_level) }}
            </option>
          }
      </select>
    </label>

    @if (selectedExam(); as exam) {
      <p class="meta">الدرجة النهائية: {{ exam.total_marks }}</p>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>الطالب</th>
              <th>الدرجة</th>
              <th>ملاحظة</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (row of students(); track row.student_id) {
              <tr>
                <td>{{ row.profiles?.full_name || row.student_id }}</td>
                <td>
                  <input
                    type="number"
                    [ngModel]="scores[row.student_id]"
                    (ngModelChange)="scores[row.student_id] = $event"
                  />
                </td>
                <td>
                  <input
                    type="text"
                    [ngModel]="notes[row.student_id]"
                    (ngModelChange)="notes[row.student_id] = $event"
                  />
                </td>
                <td>
                  <button class="btn btn-navy" type="button" (click)="save(row.student_id)">حفظ</button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="4">لا يوجد طلاب في سنة المادة دي. لما طالب يسجّل بنفس السنة هيظهر هنا.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </app-panel>
</app-teacher-shell>
